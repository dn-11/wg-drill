name: goreleaser

on:
  push:
    tags:
      - "*"
  # workflow_dispatch:
  #   inputs:
  #     project:
  #       description: "Which project to release (client, server, or both)"
  #       required: true
  #       default: "both"
  #       type: choice
  #       options:
  #         - client
  #         - server
  #         - both

permissions:
  contents: write

jobs:
  release-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
      - name: Run GoReleaser for wg-drill-client
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workDir: wg-drill-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
      - name: Run GoReleaser for wg-drill-server
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workDir: wg-drill-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
